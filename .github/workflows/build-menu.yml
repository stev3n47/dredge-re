name: Build DREMenu.dylib

on:
  workflow_dispatch:
  push:
    paths:
      - 'menu/**'
      - '.github/workflows/build-menu.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -dynamiclib \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -fobjc-arc -O2 -lc++ -lc++abi \
            -install_name '@executable_path/Frameworks/DREMenu.framework/DREMenu' \
            -o DREMenu menu/DREMenu.mm
          # Ad-hoc sign so re-signers (Singulous etc.) detect a LC_CODE_SIGNATURE to replace;
          # an unsigned binary is skipped by signers -> unsigned binary fails install.
          codesign --force --sign - DREMenu
          file DREMenu
          otool -L DREMenu
          codesign -dv DREMenu 2>&1 | head -5
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DREMenu
          path: DREMenu
