name: Build BDPlus.dylib

on:
  workflow_dispatch:
  push:
    paths:
      - 'next-game/bulldozer/BDPlus.m'
      - 'next-game/bulldozer/il2cpp_*.h'
      - 'next-game/bulldozer/il2cpp_*.c'
      - 'next-game/bulldozer/feature_*.c'
      - 'next-game/bulldozer/features.h'
      - 'next-game/bulldozer/pac_swap.c'
      - 'next-game/bulldozer/pac_swap.h'
      - 'next-game/bulldozer/bdplus_menu.m'
      - '.github/workflows/build-bdplus.yml'

permissions:
  contents: write

concurrency:
  group: bdplus-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          # Same recipe as PFPlus: -framework CoreFoundation for the real
          # kCFRunLoopCommonModes global (CFRunLoopAddTimer compares the
          # mode by pointer, not content), dynamic_lookup for il2cpp_*
          # symbols resolved at runtime via dlsym on UnityFramework.
          clang -arch arm64 -dynamiclib \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fno-objc-arc -fblocks -O2 -fno-objc-exceptions \
            -fvisibility=hidden \
            -Wl,-undefined,dynamic_lookup -lSystem \
            -framework CoreFoundation \
            -Wl,-x -Wl,-unexported_symbol,'*' \
            -install_name '@executable_path/Frameworks/BDPlus.framework/BDPlus' \
            -o BDPlus \
              next-game/bulldozer/BDPlus.m \
              next-game/bulldozer/bdplus_menu.m \
              next-game/bulldozer/il2cpp_bridge.c \
              next-game/bulldozer/pac_swap.c \
              next-game/bulldozer/feature_*.c
          strip -x BDPlus || true
          file BDPlus
          otool -L BDPlus
          # Real (self-signed) cert — not ad-hoc. Signulous-style re-signers
          # enumerate nested binaries by their CMS signature; a stripped stub
          # gets skipped, stays unsigned, and iOS kills the app on launch.
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem \
            -days 30 -nodes -subj "/CN=BDPlus/" \
            -addext "keyUsage=critical,digitalSignature" \
            -addext "extendedKeyUsage=critical,codeSigning" \
            -addext "basicConstraints=critical,CA:FALSE"
          openssl pkcs12 -export -legacy -out id.p12 -inkey key.pem -in cert.pem -passout pass:temp
          security create-keychain -p temp t.keychain
          security default-keychain -s t.keychain
          security list-keychains -d user -s t.keychain
          security unlock-keychain -p temp t.keychain
          security import id.p12 -k t.keychain -P temp -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp t.keychain
          codesign --force --sign "BDPlus" BDPlus
          codesign -dv BDPlus 2>&1 | head -5
      - name: Re-sign + verify like a sideload re-signer
        run: |
          codesign --force --sign "BDPlus" BDPlus
          codesign -vvv --deep BDPlus
          otool -l BDPlus | grep -A4 LC_CODE_SIGNATURE
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDPlus
          path: BDPlus
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rolling "bdplus-latest" release so the signed dylib is reachable
          # from a github.com URL — the actions-artifact download redirects to
          # Azure blob which some proxies block. We overwrite the asset each
          # successful build so the latest-stable link stays current.
          TAG="bdplus-latest"
          TITLE="BDPlus.dylib · ${GITHUB_SHA::7}"
          BODY=$(printf 'BDPlus arm64 iOS dylib built from %s on %s.\n\nSize: %s bytes.\nIntegrity: %s\n\nUsage: python tools/inject_bulldozer.py <Bulldozer.ipa> BDPlus <out.ipa>; sign with TrollStore/AltStore/SideStore/dev-signed; install.' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(stat -f%z BDPlus)" "$(shasum -a 256 BDPlus | awk '{print $1}')")
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "$BODY" \
              --target "$GITHUB_SHA"
            gh release upload "$TAG" BDPlus --clobber
          else
            gh release create "$TAG" BDPlus \
              --title "$TITLE" \
              --notes "$BODY" \
              --target "$GITHUB_SHA"
          fi
